[package]
name        = "dns-codec-nv"
version     = "0.1.1"
description = "RFC 1035 wire format as a codec with no socket: header, question, the resource records a resolver meets, name compression both directions, EDNS0, and a feed-and-drain reader for TCP's length-prefixed framing."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet; mdns-nv is the first consumer.
stability   = "experimental"

# `core`: a message in, a message out.  The socket, the retry policy and
# the cache are the resolver's, and none of them is here.  The same
# codec serves a resolver, an authoritative server, a capture tool and a
# device doing service discovery on a local link.
#
# `tests/embedded_probe.nv` builds the module for a Cortex-M4.  Every
# function is `@tier(rt)`: a message is lists and boxed structs, so it
# needs the device's heap.
layer       = "core"

category    = "networking"

tags        = ["dns", "rfc1035", "edns0", "codec", "sans-io", "resolver", "name-compression", "embedded"]
repository  = "https://github.com/novolang/dns-codec-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.21.1"

[docs.pages]
"README.md" = "DNS messages, without a socket"

[dependencies]
# None.  A wire codec over `[u8]` needs the language and nothing else,
# so it sits under a host resolver and inside a device on the same
# local link.
